modules:
  retroboard_backend:
    pipelines:
      build_backend:
        name: "Retroboard Backend Build"
        type: build
        description: "Builds, tests, and packages the Retroboard backend as an immutable Docker image"
        spec:
          path: "."
          architecture: amd64
          os: linux
          resources:
            cpu: "2000m"
            memory: "4Gi"
          variables:
            NODE_ENV: "production"
            NPM_CONFIG_CACHE: "/tmp/.npm"
          commands:
            - type: build
              name: Install Dependencies
              image: node:18-alpine
              spec:
                command: |
                  npm ci --prefer-offline
            - type: build
              name: Lint Code
              image: node:18-alpine
              spec:
                command: |
                  npm run lint
            - type: build
              name: Run Unit Tests
              image: node:18-alpine
              spec:
                command: |
                  npm test -- --reporter=xunit --outputFile=test-results.xml
                testReportPaths:
                  - "test-results.xml"
            - type: build
              name: Build Application
              image: node:18-alpine
              spec:
                command: |
                  npm run build
                  ls -la dist/
            - type: build
              name: Docker Build & Push
              image: docker:24.0.5
              spec:
                command: |
                  docker build --pull --no-cache -t $DOCKER_REGISTRY/retroboard-backend:${BUILD_NUMBER} .
                  docker push $DOCKER_REGISTRY/retroboard-backend:${BUILD_NUMBER}
          artifacts:
            docker:
              context: "."
              dockerfile: "Dockerfile"
              repoName: "retroboard-backend"
              immutable: true
              additionalTags:
                primaryTags:
                  - "stable"
                  - "v${BUILD_NUMBER}"
                tagTags:
                  - "${TAG_NAME}"
          coverage:
            exclusions:
              - "**/*.spec.js"
              - "**/*.test.js"
              - "**/node_modules/**"
            reports:
              - path: "coverage/lcov.info"
          triggers:
            - type: commit
              name: "Build on Main Branch"
              description: "Trigger build on commits to main branch"
              enabled: true
              pushArtifact: true
              triggerDeployment: true
              spec:
                branch: main
                condition:
                  type: Regex
                  value: ^(?!\.harness/)(?!terraform/).*
            - type: tag
              name: "Build on Tag"
              description: "Trigger build on tag creation"
              enabled: true
              pushArtifact: true
              triggerDeployment: true
              spec: {}

